<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>200 Magic Words — Direction E2: Candy Galaxy, No Emoji (Lesson Screen)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    /* Locked candy tokens — identical values to mockup-D-candy-galaxy.html */
    --sky:#5B4BD6; --sky-deep:#3D2FA8; --sky-night:#2B2080;
    --sun:#FFC531; --mint:#3EE0B8; --bubble:#FF6FA5; --tang:#FF8A4C;
    --cloud:#FFFFFF; --ink:#2A2160;
    --display:'Baloo 2',sans-serif; --body:'Quicksand',sans-serif;
    --chunk:0 8px 0 rgba(0,0,0,.16);
    --chunk-sm:0 5px 0 rgba(0,0,0,.14);

    /* Animal style-reference palette — locked, reused verbatim by WordArt.jsx.
       Rule for every WordArt illustration: chunky rounded body shape, ~4px
       stroke in the paired "outline" shade below, two dot eyes with a white
       highlight, small blush-pink cheek circles, minimal internal detail. */
    --dog-fill:#FFB84D;    --dog-outline:#A66A1B; --dog-inner:#FFF1D6;
    --elephant-fill:#B8B4E8; --elephant-outline:#6B63B5; --elephant-inner:#E8E6FF;
    --cat-fill:#FF8A4C;    --cat-outline:#B35A28; --cat-inner:#FFD9BE;
    --bird-fill:#5EC8F2;   --bird-outline:#2E86AB; --bird-inner:#CDEFFF;
    --blush:#FF8FA8; --dot:#2A2160;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);color:var(--cloud);overflow-x:hidden;
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky-deep) 55%,var(--sky-night) 100%);
    min-height:100vh}

  /* ── LESSON STAGE — centered, fixed 780px, low-motion chrome ── */
  .stage{position:relative;max-width:780px;margin:0 auto;padding:28px 24px 60px;z-index:1}

  /* ── TOP BAR: close + star progress segments ── */
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .icon-btn{width:44px;height:44px;border-radius:16px;background:rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
    transition:transform .15s,background .15s;border:none}
  .icon-btn:hover{background:rgba(255,255,255,.22)}
  .icon-btn:active{transform:translateY(2px)}
  .icon-btn svg{width:20px;height:20px}

  .star-progress{flex:1;display:flex;gap:8px}
  .seg{flex:1;height:14px;border-radius:100px;background:rgba(255,255,255,.16);position:relative;overflow:hidden}
  .seg .fill{position:absolute;inset:0;border-radius:100px;background:linear-gradient(90deg,var(--sun),#FFDD7A);
    width:0%;transition:width .6s cubic-bezier(.2,.9,.3,1.3)}
  .seg.lit .fill{width:100%}
  .seg .ignite{position:absolute;right:-2px;top:50%;transform:translateY(-50%) scale(0);width:22px;height:22px;
    transition:transform .4s cubic-bezier(.3,1.7,.4,1)}
  .seg.lit .ignite{transform:translateY(-50%) scale(1)}
  .seg .ignite svg{width:100%;height:100%;filter:drop-shadow(0 0 6px rgba(255,197,49,.9))}

  /* ── NOVA PORTHOLE + speech bubble ── */
  .nova-row{display:flex;align-items:center;gap:14px;margin:26px 0 20px}
  .porthole{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7A6BF0,var(--sky-deep) 70%);
    border:5px solid rgba(255,255,255,.9);box-shadow:var(--chunk-sm);position:relative;overflow:hidden;flex:0 0 auto}
  .nova{position:absolute;inset:10%;transition:transform .4s cubic-bezier(.3,1.6,.4,1)}
  .nova.celebrate{animation:novaBounce .6s cubic-bezier(.3,1.6,.4,1)}
  @keyframes novaBounce{0%{transform:scale(1) translateY(0)}35%{transform:scale(1.12) translateY(-8px)}100%{transform:scale(1) translateY(0)}}
  .n-core{position:absolute;inset:8%;border-radius:50% 50% 46% 54%/56% 50% 50% 44%;
    background:radial-gradient(circle at 36% 30%,#FFF6D8,var(--sun) 55%,#F09A12 100%)}
  .n-eye{position:absolute;top:34%;width:11%;height:16%;border-radius:50%;background:var(--ink)}
  .n-eye.l{left:30%}.n-eye.r{right:30%}
  .n-eye::after{content:'';position:absolute;top:15%;left:15%;width:42%;height:42%;border-radius:50%;background:#fff}
  .n-smile{position:absolute;top:56%;left:50%;transform:translateX(-50%);width:22%;height:11%;
    border-radius:0 0 40px 40px;background:var(--ink)}
  .nova.celebrate .n-smile{width:30%;height:16%;border-radius:0 0 50px 50px}

  .bubble{background:var(--cloud);color:var(--ink);border-radius:22px 22px 22px 4px;padding:12px 18px;
    font-family:var(--display);font-weight:700;font-size:.95rem;box-shadow:var(--chunk-sm);
    position:relative;opacity:0;transform:translateX(-8px) scale(.9);transition:all .35s cubic-bezier(.2,.9,.3,1.4)}
  .bubble.show{opacity:1;transform:none}

  /* ── QUESTION PROMPT ── */
  .prompt{font-family:var(--display);font-weight:800;font-size:1.6rem;text-align:center;
    margin:8px 0 34px;line-height:1.25}
  .prompt .target{color:var(--sun)}

  /* ── 2×2 BIG-ART ANSWER GRID ── */
  .tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:560px;margin:0 auto}
  .tile{background:var(--cloud);border-radius:32px;padding:22px 14px 16px;box-shadow:var(--chunk);
    cursor:pointer;text-align:center;position:relative;
    opacity:0;transform:translateY(28px) scale(.85);
    transition:transform .55s cubic-bezier(.2,.9,.3,1.5),opacity .5s,box-shadow .2s,filter .35s}
  .tile.show{opacity:1;transform:none}
  .tile:nth-child(1){transition-delay:.05s}
  .tile:nth-child(2){transition-delay:.15s}
  .tile:nth-child(3){transition-delay:.25s}
  .tile:nth-child(4){transition-delay:.35s}
  .tile:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 14px 0 rgba(0,0,0,.18)}
  .tile:active,.tile.pressed{transform:translateY(6px) scale(.98) !important;box-shadow:0 2px 0 rgba(0,0,0,.16) !important}
  .tile .art{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .tile .art svg{width:88%;height:88%}
  .tile .label{font-family:var(--display);font-weight:800;color:var(--ink);font-size:1.05rem;margin-top:6px}

  /* correct-answer hint glow (errorless scaffold — no red, no X) */
  .tile.hint-glow{box-shadow:var(--chunk),0 0 0 5px rgba(62,224,184,.55),0 0 26px rgba(62,224,184,.6);
    animation:hintPulse 1.4s ease-in-out infinite}
  @keyframes hintPulse{0%,100%{box-shadow:var(--chunk),0 0 0 5px rgba(62,224,184,.4),0 0 22px rgba(62,224,184,.45)}
    50%{box-shadow:var(--chunk),0 0 0 8px rgba(62,224,184,.65),0 0 34px rgba(62,224,184,.7)}}

  /* wrong-answer treatment: wiggle + soften. No shake-red, no X mark. */
  .tile.wiggle{animation:wiggle .45s ease}
  @keyframes wiggle{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-6px) rotate(-2deg)}
    40%{transform:translateX(5px) rotate(2deg)}60%{transform:translateX(-4px) rotate(-1.5deg)}80%{transform:translateX(3px) rotate(1deg)}}
  .tile.soften{filter:saturate(.55) opacity(1);opacity:.55}

  .tile.correct-flash{box-shadow:var(--chunk),0 0 0 6px rgba(62,224,184,.75),0 0 30px rgba(62,224,184,.8)}

  /* ── SVG STAR CONFETTI (correct-answer celebration) ── */
  .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:40}
  .confetti-star{position:absolute;width:18px;height:18px;opacity:0;
    animation:confettiPop .9s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes confettiPop{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.1)}}

  /* ── DEMO CONTROLS (not part of the product UI — mockup only) ── */
  .demo-controls{max-width:560px;margin:36px auto 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .demo-btn{font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--ink);background:var(--cloud);
    border:none;border-radius:100px;padding:10px 18px;cursor:pointer;box-shadow:var(--chunk-sm)}
  .demo-btn:active{transform:translateY(3px)}
  .note{margin-top:40px;text-align:center;color:rgba(255,255,255,.55);font-size:.7rem;font-weight:600}

  /* ── STYLE-REFERENCE STRIP: the 4 locked animals at full size ── */
  .ref-strip{max-width:780px;margin:56px auto 0;padding-top:32px;border-top:2px dashed rgba(255,255,255,.25)}
  .ref-title{font-family:var(--display);font-weight:800;font-size:1rem;text-align:center;margin-bottom:18px;
    color:rgba(255,255,255,.85)}
  .ref-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:520px;margin:0 auto}
  .ref-card{background:var(--cloud);border-radius:24px;padding:14px;text-align:center;box-shadow:var(--chunk-sm)}
  .ref-card svg{width:100%;aspect-ratio:1}
  .ref-card .nm{font-family:var(--display);font-weight:800;color:var(--ink);font-size:.72rem;margin-top:6px}
</style>
</head>
<body>

<div class="stage">

  <!-- TOP BAR -->
  <div class="topbar">
    <button class="icon-btn" aria-label="Close lesson">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
    </button>
    <div class="star-progress" id="progress">
      <div class="seg lit"><div class="fill"></div>
        <div class="ignite"><svg viewBox="0 0 24 24"><path fill="var(--sun)" d="M12 1l3.09 6.26L22 8.27l-5 4.87L18.18 20 12 16.77 5.82 20 7 13.14 2 8.27l6.91-1.01z"/></svg></div>
      </div>
      <div class="seg lit"><div class="fill"></div>
        <div class="ignite"><svg viewBox="0 0 24 24"><path fill="var(--sun)" d="M12 1l3.09 6.26L22 8.27l-5 4.87L18.18 20 12 16.77 5.82 20 7 13.14 2 8.27l6.91-1.01z"/></svg></div>
      </div>
      <div class="seg" id="seg3"><div class="fill"></div>
        <div class="ignite"><svg viewBox="0 0 24 24"><path fill="var(--sun)" d="M12 1l3.09 6.26L22 8.27l-5 4.87L18.18 20 12 16.77 5.82 20 7 13.14 2 8.27l6.91-1.01z"/></svg></div>
      </div>
      <div class="seg"><div class="fill"></div></div>
      <div class="seg"><div class="fill"></div></div>
    </div>
    <button class="icon-btn" aria-label="Hear the word again">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path d="M16 8.5a5 5 0 010 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- NOVA PORTHOLE + SPEECH BUBBLE -->
  <div class="nova-row">
    <div class="porthole">
      <div class="nova" id="nova">
        <div class="n-core"></div>
        <div class="n-eye l"></div><div class="n-eye r"></div><div class="n-smile"></div>
      </div>
    </div>
    <div class="bubble show" id="bubble">Which one is a dog?</div>
  </div>

  <!-- PROMPT -->
  <div class="prompt">Tap the picture of <span class="target">dog</span></div>

  <!-- 2×2 BIG-ART TILES -->
  <div class="tile-grid" id="grid">
    <div class="tile" data-answer="dog" onclick="tapTile(this)">
      <div class="art">
        <svg viewBox="0 0 120 120"><use href="#art-dog"/></svg>
      </div>
      <div class="label">dog</div>
    </div>
    <div class="tile" data-answer="cat" onclick="tapTile(this)">
      <div class="art">
        <svg viewBox="0 0 120 120"><use href="#art-cat"/></svg>
      </div>
      <div class="label">cat</div>
    </div>
    <div class="tile" data-answer="elephant" onclick="tapTile(this)">
      <div class="art">
        <svg viewBox="0 0 120 120"><use href="#art-elephant"/></svg>
      </div>
      <div class="label">elephant</div>
    </div>
    <div class="tile" data-answer="bird" onclick="tapTile(this)">
      <div class="art">
        <svg viewBox="0 0 120 120"><use href="#art-bird"/></svg>
      </div>
      <div class="label">bird</div>
    </div>
  </div>

  <div class="demo-controls">
    <button class="demo-btn" onclick="replay()">Replay entrance</button>
    <button class="demo-btn" onclick="resetDemo()">Reset</button>
  </div>

  <div class="note">Direction E2 · Candy Galaxy, No Emoji · lesson-screen gold standard · zero emoji, chunky SVG art only</div>

  <!-- STYLE-REFERENCE STRIP — the 4 locked animal illustrations, extracted verbatim by WordArt.jsx -->
  <div class="ref-strip">
    <div class="ref-title">Style reference — locked animal palette (verbatim source for WordArt.jsx)</div>
    <div class="ref-grid">
      <div class="ref-card"><svg viewBox="0 0 120 120"><use href="#art-dog"/></svg><div class="nm">dog</div></div>
      <div class="ref-card"><svg viewBox="0 0 120 120"><use href="#art-elephant"/></svg><div class="nm">elephant</div></div>
      <div class="ref-card"><svg viewBox="0 0 120 120"><use href="#art-cat"/></svg><div class="nm">cat</div></div>
      <div class="ref-card"><svg viewBox="0 0 120 120"><use href="#art-bird"/></svg><div class="nm">bird</div></div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════
     STYLE-REFERENCE SVG DEFINITIONS — the 4 locked animals.
     Construction rule for every WordArt illustration in this style:
       • chunky rounded body via ellipse/circle/rounded-path primitives
       • ~4px stroke, in the paired darker "outline" shade
       • two dot eyes (dark) each with a small white highlight circle
       • small blush-pink cheek ellipses
       • minimal internal detail — silhouette + one or two accent shapes
     ══════════════════════════════════════════════════════════════ -->
<svg width="0" height="0" style="position:absolute">
  <defs>

    <!-- DOG -->
    <g id="art-dog">
      <ellipse cx="60" cy="100" rx="30" ry="7" fill="rgba(0,0,0,.12)"/>
      <path d="M28 66c-10-8-14-24-2-28 6-2 10 4 10 4" fill="var(--dog-fill)" stroke="var(--dog-outline)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M92 66c10-8 14-24 2-28-6-2-10 4-10 4" fill="var(--dog-fill)" stroke="var(--dog-outline)" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="60" cy="62" r="38" fill="var(--dog-fill)" stroke="var(--dog-outline)" stroke-width="4"/>
      <ellipse cx="60" cy="78" rx="18" ry="14" fill="var(--dog-inner)"/>
      <circle cx="46" cy="56" r="6.5" fill="var(--dot)"/><circle cx="48.2" cy="53.6" r="2" fill="#fff"/>
      <circle cx="74" cy="56" r="6.5" fill="var(--dot)"/><circle cx="76.2" cy="53.6" r="2" fill="#fff"/>
      <ellipse cx="60" cy="76" rx="7" ry="5.5" fill="var(--dog-outline)"/>
      <path d="M50 88q10 8 20 0" fill="none" stroke="var(--dog-outline)" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="38" cy="70" rx="7" ry="4.5" fill="var(--blush)" opacity=".8"/>
      <ellipse cx="82" cy="70" rx="7" ry="4.5" fill="var(--blush)" opacity=".8"/>
    </g>

    <!-- CAT -->
    <g id="art-cat">
      <ellipse cx="60" cy="100" rx="30" ry="7" fill="rgba(0,0,0,.12)"/>
      <path d="M34 42l-6-22 20 14z" fill="var(--cat-fill)" stroke="var(--cat-outline)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M86 42l6-22-20 14z" fill="var(--cat-fill)" stroke="var(--cat-outline)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M40 34l-2-9 9 6z" fill="var(--cat-inner)"/>
      <path d="M80 34l2-9-9 6z" fill="var(--cat-inner)"/>
      <circle cx="60" cy="64" r="36" fill="var(--cat-fill)" stroke="var(--cat-outline)" stroke-width="4"/>
      <ellipse cx="60" cy="80" rx="17" ry="13" fill="var(--cat-inner)"/>
      <circle cx="47" cy="60" r="6" fill="var(--dot)"/><circle cx="49" cy="57.8" r="1.8" fill="#fff"/>
      <circle cx="73" cy="60" r="6" fill="var(--dot)"/><circle cx="75" cy="57.8" r="1.8" fill="#fff"/>
      <path d="M60 74l-5 5h10z" fill="var(--cat-outline)"/>
      <ellipse cx="38" cy="74" rx="6.5" ry="4.2" fill="var(--blush)" opacity=".8"/>
      <ellipse cx="82" cy="74" rx="6.5" ry="4.2" fill="var(--blush)" opacity=".8"/>
    </g>

    <!-- ELEPHANT -->
    <g id="art-elephant">
      <ellipse cx="60" cy="102" rx="34" ry="7" fill="rgba(0,0,0,.12)"/>
      <circle cx="24" cy="60" r="24" fill="var(--elephant-fill)" stroke="var(--elephant-outline)" stroke-width="4"/>
      <circle cx="24" cy="60" r="13" fill="var(--elephant-inner)"/>
      <circle cx="96" cy="60" r="24" fill="var(--elephant-fill)" stroke="var(--elephant-outline)" stroke-width="4"/>
      <circle cx="96" cy="60" r="13" fill="var(--elephant-inner)"/>
      <circle cx="60" cy="58" r="40" fill="var(--elephant-fill)" stroke="var(--elephant-outline)" stroke-width="4"/>
      <path d="M50 82q-4 20 0 30q6 6 12 0" fill="none" stroke="var(--elephant-outline)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="47" cy="54" r="6" fill="var(--dot)"/><circle cx="49" cy="51.8" r="1.8" fill="#fff"/>
      <circle cx="73" cy="54" r="6" fill="var(--dot)"/><circle cx="75" cy="51.8" r="1.8" fill="#fff"/>
      <ellipse cx="38" cy="66" rx="6.5" ry="4.2" fill="var(--blush)" opacity=".8"/>
      <ellipse cx="82" cy="66" rx="6.5" ry="4.2" fill="var(--blush)" opacity=".8"/>
    </g>

    <!-- BIRD -->
    <g id="art-bird">
      <ellipse cx="60" cy="102" rx="26" ry="6" fill="rgba(0,0,0,.12)"/>
      <ellipse cx="60" cy="76" rx="34" ry="28" fill="var(--bird-fill)" stroke="var(--bird-outline)" stroke-width="4"/>
      <path d="M30 80q-14-2-16-14q10 0 20 6z" fill="var(--bird-fill)" stroke="var(--bird-outline)" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="66" cy="42" r="26" fill="var(--bird-fill)" stroke="var(--bird-outline)" stroke-width="4"/>
      <path d="M90 42l14 6-14 6z" fill="var(--sun)" stroke="var(--bird-outline)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="74" cy="36" r="5.5" fill="var(--dot)"/><circle cx="76" cy="34" r="1.6" fill="#fff"/>
      <ellipse cx="52" cy="46" rx="6" ry="4" fill="var(--blush)" opacity=".8"/>
      <ellipse cx="46" cy="86" rx="14" ry="10" fill="var(--bird-inner)"/>
    </g>

  </defs>
</svg>

<div class="confetti-layer" id="confetti"></div>

<script>
  // reveal tiles with staggered spring entrance on load
  function enter(){
    document.querySelectorAll('.seg').forEach((s,i)=>{ if(i<2) s.classList.add('lit'); });
    document.querySelectorAll('.tile').forEach(t=>t.classList.add('show'));
  }
  requestAnimationFrame(()=>requestAnimationFrame(enter));

  const bubble = document.getElementById('bubble');
  const nova = document.getElementById('nova');

  function burstConfetti(){
    const layer = document.getElementById('confetti');
    const cx = innerWidth/2, cy = innerHeight/2.4;
    for(let i=0;i<14;i++){
      const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
      s.setAttribute('viewBox','0 0 24 24');
      s.classList.add('confetti-star');
      const ang = Math.random()*Math.PI*2, dist = 90+Math.random()*140;
      s.style.setProperty('--dx', Math.cos(ang)*dist+'px');
      s.style.setProperty('--dy', Math.sin(ang)*dist+'px');
      s.style.setProperty('--rot', (Math.random()*360-180)+'deg');
      s.style.left = cx+'px'; s.style.top = cy+'px';
      s.style.animationDelay = (Math.random()*.15)+'s';
      const colors=['var(--sun)','var(--mint)','var(--bubble)','var(--tang)'];
      s.innerHTML = `<path fill="${colors[i%4]}" d="M12 1l3.09 6.26L22 8.27l-5 4.87L18.18 20 12 16.77 5.82 20 7 13.14 2 8.27l6.91-1.01z"/>`;
      layer.appendChild(s);
      setTimeout(()=>s.remove(),950);
    }
  }

  function tapTile(el){
    document.querySelectorAll('.tile').forEach(t=>t.onclick=null);
    const correctTile = document.querySelector('[data-answer="dog"]');
    if(el.dataset.answer === 'dog'){
      el.classList.add('correct-flash');
      nova.classList.add('celebrate');
      bubble.textContent = "That's right! Dog!";
      burstConfetti();
      document.getElementById('seg3').classList.add('lit');
      setTimeout(()=>{ document.querySelectorAll('.tile').forEach(t=>t.onclick=tapTile.bind(null,t)); nova.classList.remove('celebrate'); },900);
    } else {
      // errorless scaffold: wiggle + soften the wrong tile, hint-glow the correct one.
      // No red state, no X mark, error does not "complete" on first miss.
      el.classList.add('wiggle','soften');
      correctTile.classList.add('hint-glow');
      bubble.textContent = "Not quite — try the glowing one!";
      setTimeout(()=>{
        el.classList.remove('wiggle');
        document.querySelectorAll('.tile').forEach(t=>{ t.onclick=()=>tapTile(t); });
      },500);
    }
  }
  document.querySelectorAll('.tile').forEach(t=>{ t.onclick=()=>tapTile(t); });

  function replay(){
    document.querySelectorAll('.tile').forEach(t=>t.classList.remove('show'));
    requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.tile').forEach(t=>t.classList.add('show'))));
  }
  function resetDemo(){
    document.querySelectorAll('.tile').forEach(t=>t.classList.remove('wiggle','soften','hint-glow','correct-flash'));
    bubble.textContent = "Which one is a dog?";
    document.getElementById('seg3').classList.remove('lit');
    document.querySelectorAll('.tile').forEach(t=>{ t.onclick=()=>tapTile(t); });
